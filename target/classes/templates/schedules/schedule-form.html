<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${schedule.scheduleId == null ? 'Add Schedule' : 'Edit Schedule'} + ' | SriLanka Railways'">
        Schedule Form
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="top-header">
    <div class="brand">
        <div class="brand-icon">🚆</div>

        <div>
            <h2>SriLanka Railways</h2>
            <span>Train Schedule Management</span>
        </div>
    </div>

    <a class="back-btn" th:href="@{/schedules}">
        ← Back to Schedules
    </a>
</header>

<nav class="navbar">
    <a href="#">Home</a>
    <a class="active" th:href="@{/schedules}">Schedules</a>
    <a href="#">Trains</a>
    <a href="#">Stations</a>
</nav>

<main class="container form-container">

    <div class="page-heading">
        <p class="small-title">SRI LANKA RAILWAYS</p>

        <h1 th:text="${schedule.scheduleId == null ? 'Add Train Schedule' : 'Edit Train Schedule'}">
            Add Train Schedule
        </h1>

        <p class="description">
            Enter the train schedule information below.
        </p>
    </div>

    <div class="form-card">
        <div class="error-message"
             th:if="${errorMessage}"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/schedules/save}"
              th:object="${schedule}"
              method="post">

            <input type="hidden" th:field="*{scheduleId}">

            <div class="form-grid">

                <!-- TRAIN -->
                <div class="form-group">
                    <label for="train">Train</label>

                    <select id="train"
                            th:field="*{train}"
                            required>

                        <option value="">-- Select Train --</option>

                        <option th:each="train : ${trains}"
                                th:value="${train.trainId}"
                                th:text="${train.trainNumber + ' - ' + train.trainName}">
                        </option>

                    </select>
                </div>

                <!-- DATE -->
                <div class="form-group">
                    <label for="operatingDate">Operating Date</label>

                    <input id="operatingDate"
                           type="date"
                           th:field="*{operatingDate}"
                           required>
                </div>

                <!-- FROM -->
                <div class="form-group">
                    <label for="departureStation">Departure Station</label>

                    <select id="departureStation"
                            th:field="*{departureStation}"
                            required>

                        <option value="">-- Select Departure Station --</option>

                        <option th:each="station : ${stations}"
                                th:value="${station.stationId}"
                                th:text="${station.stationName}">
                        </option>

                    </select>
                </div>

                <!-- TO -->
                <div class="form-group">
                    <label for="arrivalStation">Arrival Station</label>

                    <select id="arrivalStation"
                            th:field="*{arrivalStation}"
                            required>

                        <option value="">-- Select Arrival Station --</option>

                        <option th:each="station : ${stations}"
                                th:value="${station.stationId}"
                                th:text="${station.stationName}">
                        </option>

                    </select>
                </div>

                <!-- DEPARTURE TIME -->
                <div class="form-group">
                    <label for="departureTime">Departure Time</label>

                    <input id="departureTime"
                           type="time"
                           th:field="*{departureTime}"
                           required>
                </div>

                <!-- ARRIVAL TIME -->
                <div class="form-group">
                    <label for="arrivalTime">Arrival Time</label>

                    <input id="arrivalTime"
                           type="time"
                           th:field="*{arrivalTime}"
                           required>
                </div>

                <!-- PLATFORM -->
                <div class="form-group">
                    <label for="platformNumber">Platform Number</label>

                    <input id="platformNumber"
                           type="text"
                           th:field="*{platformNumber}"
                           placeholder="Example: 3"
                           required>
                </div>

                <!-- STATUS -->
                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status"
                            th:field="*{status}"
                            required>

                        <option value="Scheduled">Scheduled</option>
                        <option value="Delayed">Delayed</option>
                        <option value="Cancelled">Cancelled</option>

                    </select>
                </div>

            </div>

            <div class="form-actions">

                <a class="cancel-btn"
                   th:href="@{/schedules}">
                    Cancel
                </a>

                <button class="save-btn"
                        type="submit">
                    Save Schedule
                </button>

            </div>

        </form>

    </div>

</main>

<footer>
    <p>© 2026 SriLanka Railways | Train Schedule Management System</p>
</footer>

</body>
</html>
